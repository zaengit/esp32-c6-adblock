[platformio]
default_envs = c6

[env]
; Pin the verified pioarduino release so builds do not drift with the stable alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
monitor_speed = 115200

; The attached ESP32-C6 module was detected with 16 MB flash.
[env:c6]
board = esp32-c6-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; Select this environment for an 8 MB ESP32-C6 module.
[env:c6_8mb]
extends = env:c6
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
